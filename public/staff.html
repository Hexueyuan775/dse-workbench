<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="cloud.js?v=2"></script>
<title>DSE 内容工作台 · 员工版</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --line:#ececf0; --line-2:#e3e4ea;
    --txt:#1c1d22; --txt-2:#5b5f6b; --txt-3:#9a9ea9;
    --accent:#ff2e4d; --accent-soft:#fff0f3;
    --green:#12b76a; --green-soft:#eafaf1;
    --amber:#f79009; --amber-soft:#fff6e8;
    --blue:#3b82f6; --blue-soft:#eef4ff;
    --purple:#8b5cf6; --purple-soft:#f3efff;
    --radius:14px; --radius-sm:10px;
    --shadow:0 1px 2px rgba(20,20,30,.04), 0 4px 16px rgba(20,20,30,.05);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--txt);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;font-size:13.5px;color:var(--txt);}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#d8dae0;border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  .app{min-height:100vh;display:flex;flex-direction:column;}
  .topbar{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:.2px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);}
  .brand small{font-weight:500;color:var(--txt-3);font-size:12px;margin-left:2px;}
  .top-meta{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--txt-2);font-size:12.5px;flex-wrap:wrap;}
  .top-meta b{color:var(--txt);font-weight:600;}

  .tabs{display:flex;gap:2px;padding:10px 16px 0;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);}
  .tab{border:none;background:transparent;padding:8px 13px;border-radius:9px 9px 0 0;font-size:13px;font-weight:600;color:var(--txt-3);position:relative;}
  .tab.active{color:var(--txt);}
  .tab.active::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px;}
  .tab .cnt{font-size:10.5px;color:var(--txt-3);font-weight:500;margin-left:3px;}
  .main{flex:1;padding:14px 16px 40px;width:100%;max-width:940px;margin:0 auto;}

  .btn{border:1px solid var(--line-2);background:#fff;color:var(--txt);border-radius:9px;padding:6px 11px;font-size:12.5px;font-weight:550;transition:.15s;white-space:nowrap;}
  .btn:hover{border-color:#cfd1d9;background:#fbfbfc;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{background:#ef2340;border-color:#ef2340;}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--txt-2);}
  .btn.ghost:hover{background:#f2f3f6;color:var(--txt);}
  .btn.sm{padding:4px 8px;font-size:11.5px;}
  .btn.block{width:100%;display:flex;justify-content:center;}

  .filters{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
  .chip{border:1px solid var(--line-2);background:#fff;border-radius:20px;padding:4px 10px;font-size:11.5px;color:var(--txt-2);font-weight:550;transition:.15s;}
  .chip:hover{border-color:#cfd1d9;}
  .chip.active{background:var(--txt);border-color:var(--txt);color:#fff;}
  .chip.src-摘星.active{background:#ff8a3d;border-color:#ff8a3d;}
  .chip.src-遵理.active{background:var(--blue);border-color:var(--blue);}
  .search{flex:1;min-width:130px;border:1px solid var(--line-2);border-radius:9px;padding:6px 10px;outline:none;background:#fbfbfc;}
  .search:focus{border-color:#c9ccd6;background:#fff;}

  .pool-item{border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;transition:.15s;background:#fff;}
  .pool-item:hover{border-color:#d9dbe2;background:#fcfcfd;}
  .pool-top{display:flex;gap:8px;align-items:flex-start;}
  .pool-title{font-size:13px;font-weight:600;flex:1;min-width:0;}
  .pool-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px;color:var(--txt-3);font-size:11px;}
  .pool-item a{color:var(--blue);text-decoration:none;font-size:11px;}
  .pool-item a:hover{text-decoration:underline;}
  .tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:10.5px;font-weight:600;background:#f1f2f5;color:var(--txt-2);}
  .tag.src-摘星{background:#fff2e8;color:#c2410c;}
  .tag.src-遵理{background:var(--blue-soft);color:#2563eb;}
  .tag.ok{background:var(--green-soft);color:#0a8a4f;}
  .tag.wait{background:var(--amber-soft);color:#b25e00;}
  .tag.bad{background:var(--accent-soft);color:#d81e3f;}
  .mini{border:1px solid var(--line-2);border-radius:8px;padding:3px 7px;font-size:11px;background:#fff;}

  h4.sec{font-size:12.5px;margin:18px 0 8px;color:var(--txt-2);font-weight:700;letter-spacing:.2px;}
  .empty-tip{color:var(--txt-3);font-size:12.5px;text-align:center;padding:20px 8px;line-height:1.7;}
  .hint-box{background:var(--blue-soft);border:1px solid #dbe7ff;border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;color:#1d4ed8;line-height:1.75;margin-bottom:10px;}
  .divider{height:1px;background:var(--line);margin:14px 0;}
  .sub{color:var(--txt-3);font-weight:400;font-size:11.5px;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:6px;}
  .stat{border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;background:#fcfcfd;}
  .stat .k{font-size:11px;color:var(--txt-3);font-weight:600;}
  .stat .v{font-size:18px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;}

  .chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:8px;background:#fff;cursor:pointer;}
  .chk input{margin-top:2px;width:16px;height:16px;accent-color:var(--accent);flex:0 0 auto;}
  .chk .box{flex:0 0 auto;min-width:16px;}
  .chk .chk-t{display:block;font-size:13px;font-weight:600;}
  .chk .chk-d{display:block;font-size:11.5px;color:var(--txt-3);margin-top:1px;}
  .chk.done{background:var(--green-soft);border-color:#cdeedd;}
  .chk.done .chk-t{text-decoration:line-through;color:var(--txt-3);}

  .field{margin-bottom:10px;}
  .field label{display:block;font-size:11.5px;font-weight:650;color:var(--txt-2);margin-bottom:5px;}
  .inp{width:100%;border:1px solid var(--line-2);border-radius:9px;padding:8px 10px;outline:none;background:#fbfbfc;transition:.15s;}
  .inp:focus{border-color:#c9ccd6;background:#fff;}
  textarea.inp{resize:vertical;line-height:1.7;}
  select.inp{background:#fbfbfc;}
  .row{display:flex;gap:8px;align-items:center;}
  .daily-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .daily-form .field{margin:0;}
  .daily-form .full{grid-column:1/-1;}

  table.tb{width:100%;border-collapse:collapse;font-size:12px;}
  table.tb th,table.tb td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:middle;}
  table.tb th{font-size:11px;color:var(--txt-3);font-weight:650;background:#fafbfc;}

  .link-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:#fff;border-radius:10px;
    padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--txt);text-decoration:none;transition:.15s;}
  .link-btn:hover{border-color:var(--accent);color:var(--accent);}
  .link-btn.hot{background:var(--accent);border-color:var(--accent);color:#fff;}
  .link-btn.hot:hover{background:#ef2340;color:#fff;}

  .overlay{position:fixed;inset:0;background:rgba(20,20,30,.34);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
  .overlay.show{display:flex;}
  .modal{background:#fff;border-radius:16px;width:520px;max-width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(20,20,30,.22);}
  .modal-head{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;}
  .modal-head h3{margin:0;font-size:15px;font-weight:700;}
  .modal-head .x{margin-left:auto;cursor:pointer;color:var(--txt-3);font-size:18px;line-height:1;}
  .modal-body{padding:16px 20px;}
  .modal-foot{padding:12px 20px 18px;display:flex;gap:8px;justify-content:flex-end;}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--txt);color:#fff;
    padding:9px 16px;border-radius:10px;font-size:12.5px;font-weight:550;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .gate{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:20px;overflow:auto;
    background:radial-gradient(1100px 460px at 18% -8%, #ffe9ee 0%, rgba(255,233,238,0) 62%),
      radial-gradient(900px 480px at 102% 6%, #e9f0ff 0%, rgba(233,240,255,0) 58%), var(--bg);}
  .gate.show{display:flex;}
  .gate-card{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:18px;
    box-shadow:0 14px 44px rgba(20,20,30,.11);padding:26px 24px 22px;}
  .gate-logo{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:750;letter-spacing:.2px;}
  .gate-logo .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);}
  .gate-sub{color:var(--txt-3);font-size:12.5px;margin:6px 0 18px;}
  .gate-body .field{margin-bottom:12px;}
  .gate-note{font-size:11.5px;color:var(--txt-3);line-height:1.8;}
  .gate-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line-2);}
  .gate-err{color:var(--accent);font-size:12px;margin-top:8px;min-height:17px;}
  .who{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--txt-2);}
  .who .badge{background:var(--txt);color:#fff;border-radius:20px;padding:2px 9px;font-weight:600;font-size:11px;}

  /* 选题卡 / 内容比例标签 */
  .tag.cat{background:var(--accent-soft);color:#d81e3f;}
  .tag.cat-exp{background:var(--amber-soft);color:#b45309;}
  .tag.cat-teach{background:var(--blue-soft);color:#2563eb;}
  .tag.cat-geo{background:var(--green-soft);color:#047857;}
  .tag.cat-conv{background:var(--purple-soft);color:#7c3aed;}
  .tag.kw{background:#f1f2f5;color:#475569;}
  .topic-card{border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 11px;margin-bottom:7px;cursor:pointer;transition:.15s;background:#fff;}
  .topic-card:hover{border-color:#d9dbe2;background:#fcfcfd;}
  .topic-card.active{border-color:var(--accent);background:var(--accent-soft);}
  .topic-head{display:flex;gap:8px;align-items:flex-start;}
  .topic-idx{font-size:11px;font-weight:700;color:var(--txt-3);font-variant-numeric:tabular-nums;padding-top:1px;}
  .topic-title{font-size:12.8px;font-weight:600;flex:1;min-width:0;}
  .topic-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
  .topic-why{margin-top:7px;font-size:11px;color:var(--txt-3);}

  /* 多账号（人设）卡 */
  .acct-card{border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 11px;margin-bottom:7px;cursor:pointer;transition:.15s;background:#fff;}
  .acct-card:hover{border-color:#d9dbe2;background:#fcfcfd;}
  .acct-card.on{border-color:var(--accent);background:var(--accent-soft);}
  .acct-group{margin-bottom:10px;}
  .acct-group-h{font-size:12.5px;font-weight:700;color:var(--txt-2);margin:10px 0 6px;padding-left:8px;border-left:3px solid var(--accent);}

  /* 质检条 */
  .btn.dark{background:var(--txt);border-color:var(--txt);color:#fff;}
  .row.wrap{flex-wrap:wrap;}
  .check{border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;margin-bottom:8px;}
  .check .c-top{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;}
  .check .c-val{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;}
  .bar{height:6px;border-radius:6px;background:#eef0f4;margin-top:7px;overflow:hidden;}
  .bar > i{display:block;height:100%;border-radius:6px;transition:width .3s;}
  .bar.g > i{background:var(--green);} .bar.a > i{background:var(--amber);} .bar.r > i{background:var(--accent);}
  .c-note{margin-top:6px;font-size:11px;color:var(--txt-3);}
  .verdict{border-radius:var(--radius-sm);padding:10px 12px;font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:center;}
  .verdict.ok{background:var(--green-soft);color:#047857;}
  .verdict.warn{background:var(--amber-soft);color:#b45309;}
  .verdict.bad{background:var(--accent-soft);color:#d81e3f;}
  .taglist{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;}
</style>
</head>
<body>

<!-- 身份入口（员工版） -->
<div class="gate show" id="gate">
  <div class="gate-card">
    <div class="gate-logo"><span class="dot"></span>DSE 内容工作台 · 员工版</div>
    <div class="gate-sub">输入代号进入自己的工作台 · 主管每周会同步素材库</div>
    <div class="gate-body">
      <div class="field"><label>你的代号 / 昵称</label>
        <input class="inp" id="gateName" placeholder="例如：小林、A号、阿May" maxlength="16"></div>
      <div class="gate-note">你的人设、选题、上报只有你自己看得见。<br>进来先看「今日任务」；等主管发来<b>同步码</b>后，去「素材库」粘贴一次即可。</div>
      <div class="gate-err" id="gateErr"></div>
      <button class="btn primary block" id="btnEnter" style="margin-top:4px;padding:9px">进入我的工作台</button>
      <div class="gate-links" style="font-size:12px;color:#888;line-height:1.7">账号、笔记数据都在本页填，不用再去飞书</div>
    </div>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <div class="topbar">
    <div class="brand"><span class="dot"></span>DSE 内容工作台 <small>员工版</small></div>
    <div class="top-meta">
      <span>本周素材 <b id="metaPool">0</b> 条</span>
      <span>数据批次 <b id="metaBatch">—</b></span>
      <span>我的账号 <b id="metaAcct">0</b> 个</span>
      <span>我的选题 <b id="metaTopic">0</b></span>
      <span class="who" id="who"></span>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="today">今日任务</button>
    <button class="tab" data-tab="pool">素材库<span class="cnt" id="tabPoolCnt">0</span></button>
    <button class="tab" data-tab="topic">我的选题<span class="cnt" id="tabTopicCnt">0</span></button>
    <button class="tab" data-tab="daily">每日上报</button>
  </div>
  <div class="main" id="panelBody"></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   0. 基础
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1900); };

const FEISHU = {
  base:   'https://my.feishu.cn/base/G2tbb8Nbza3V60sQTTHcNwBcn1b',
  persona:'https://my.feishu.cn/share/base/shrcnHqujF1dHZRO8ceZEyyaiSb',
  daily:  'https://my.feishu.cn/share/base/shrcnPuTg6MeUR12UV3PD4KHIaf',
  topics: 'https://my.feishu.cn/share/base/shrcnMpvL1N8ozFSd914JMYpT0p',
  dailySimple:'https://my.feishu.cn/share/base/shrcnq8mWhXyfM0TZT0FUEKg6ye',
  dailyTable: 'https://my.feishu.cn/base/G2tbb8Nbza3V60sQTTHcNwBcn1b?table=tbl24GVXpLufTEdV'
};

function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0); }
/* 链接修正：只粘贴 www.xiaohongshu.com/... 时自动补 https://，不然主管点开会 404 */
function normLink(u){
  let s = String(u==null?'':u).trim().replace(/^[<（(「\s]+/,'').replace(/[>）)」\s]+$/,'');
  if(!s) return '';
  if(/^\/\//.test(s)) return 'https:'+s;
  if(!/^[a-zA-Z][a-zA-Z0-9+.\-]*:\/\//.test(s)) s = 'https://' + s.replace(/^\/+/, '');
  return s;
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function parseDt(s){ if(!s) return null; const d=new Date(String(s).replace(/\//g,'-')+'T00:00:00'); return isNaN(d.getTime())?null:d; }
function fmtTs(ts){ if(!ts) return '—'; const d=new Date(ts); const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }

/* =========================================================
   1. 本地存储：按员工代号命名空间隔离（与主管端同一套键，便于本机汇总）
   ========================================================= */
let NS = 'guest';
const key = f => 'dse_wb_'+NS+'_'+f+'_v2';
const lsGet = (k,d)=>{ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } };
const lsSet = (k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); if(window.__cloud) window.__cloud.touch(k,v); }catch(e){} };
function setNamespace(ns){ NS = ns||'guest'; }

let SESSION = {name:''};
let state = {pool:[], batch:'', syncedAt:0, accounts:[], activeId:'', kw:null, topics:[], activeTopic:null, drafts:{}, daily:[], check:{date:'',done:{}}, tab:'today', filter:{src:'全部', q:''}};

/* 多账号（人设）辅助 */
function accById(id){ return (state.accounts||[]).find(a=>a.id===id) || null; }
function activeAcct(){ return accById(state.activeId) || state.accounts[0] || null; }

function loadState(){
  const _seed = seedPool();
  state.pool = lsGet(key('pool'), null) || poolToItems(_seed.items, _seed.batch);
  state.batch = lsGet(key('batch'), '') || _seed.batch;
  normalizePool();                        // 素材库只保留最新一批
  state.batch = newestBatch(state.pool) || state.batch;
  state.syncedAt = lsGet(key('synced'), 0);
  const accts = lsGet(key('acct'), null);
  state.accounts = Array.isArray(accts) ? accts.filter(a=>a && a.name) : [];
  state.activeId = lsGet(key('activeId'), '') || (state.accounts[0] && state.accounts[0].id) || '';
  state.kw = lsGet(key('kw'), null) || JSON.parse(JSON.stringify(KW_DEFAULT));
  state.topics = lsGet(key('topics'), []);
  state.activeTopic = null;
  state.drafts = lsGet(key('drafts'), {}) || {};
  state.daily = lsGet(key('daily'), []);
  state.check = lsGet(key('check'), {date:'',done:{}}) || {date:'',done:{}};
  if(state.check.date !== todayStr()) state.check = {date: todayStr(), done:{}};
}
function save(){
  lsSet(key('pool'), state.pool);
  lsSet(key('batch'), state.batch);
  lsSet(key('synced'), state.syncedAt);
  lsSet(key('acct'), state.accounts);
  lsSet(key('activeId'), state.activeId);
  lsSet(key('kw'), state.kw);
  lsSet(key('topics'), state.topics);
  lsSet(key('drafts'), state.drafts);
  lsSet(key('daily'), state.daily);
  lsSet(key('check'), state.check);
  lsSet(key('who'), SESSION.name);
}
/* 打开时自动检查：若这份文件里内置的是更新的一批素材（主管重新发给你新版文件），
   就自动替换成这一批，只保留最新一批，不与旧批次累加。主管发来的同步码仍然优先。 */
function autoPullSeed(){
  try{
    const s = seedPool();
    if(!s.batch) return;
    const cur = newestBatch(state.pool);
    if(s.batch > cur){
      const before = state.pool.length;
      state.pool = poolToItems(s.items, s.batch);
      if(state.pool.length !== before) toast('素材库已更新为最新一批（'+state.pool.length+' 条）');
    }
    normalizePool();
  }catch(e){}
}

/* =========================================================
   2. 同步码：解析主管发来的素材库
   ========================================================= */
function decodeSyncCode(str){
  const s = String(str==null?'':str).trim();
  const i = s.indexOf('DSEPOOL1:');
  if(i < 0) throw new Error('不是有效的同步码');
  const b64 = s.slice(i+9).replace(/\s+/g,'');
  const json = decodeURIComponent(escape(atob(b64)));
  const data = JSON.parse(json);
  if(!data || !Array.isArray(data.items)) throw new Error('同步码内容为空');
  return data;
}
function applySyncCode(str){
  const data = decodeSyncCode(str);
  const b = data.batch || '';
  state.pool = data.items.map(x=>({id:uid(), t:x.t||'', a:x.a||'', l:x.l||'', dt:x.dt||'', s:x.s||'其他', u:x.u||'', batch:b}));
  state.batch = b;
  state.syncedAt = data.ts || Date.now();
  save();
  return state.pool.length;
}

/* 为每个人设各生成 20 条（人设之间不重复，比例 7/5/5/2/1） */
function genMyTopics(){
  const accts = (state.accounts||[]).filter(a=>a && a.name);
  if(!accts.length){ toast('先添加至少一个人设'); return; }
  const plan = planTopics();
  const used = new Set();
  const out = [];
  accts.forEach(a=>{
    const mine = [];
    (plan[a.id]||[]).forEach(t=>{ if(!used.has(t.title)){ used.add(t.title); mine.push(t); } });
    if(mine.length < 20){
      BANK.map(t=>({t, s:relevance(t,a)})).sort((x,y)=>y.s-x.s).forEach(o=>{
        if(mine.length<20 && o.s>-9999 && !used.has(o.t.title)){ used.add(o.t.title); mine.push(o.t); }
      });
    }
    mine.slice(0,20).forEach(t=> out.push({id:uid(), acctId:a.id, acctName:a.name,
      title:t.title, status:'待写', from:CAT_LABEL[t.cat], cat:t.cat, type:t.type, kw:t.kw, aud:t.aud,
      src:t.src, m:t.m, hook:t.hook, beats:t.beats, tags:t.tags}));
  });
  if(!out.length){ toast('没匹配到选题，把人设填具体一点再试'); return; }
  state.topics = out;
  state.activeTopic = null;
  save(); renderTopic(); renderMeta();
  const ex = out.filter(t=>t.aud && t.aud.length===1).length;
  toast('已为 '+accts.length+' 个人设各生成 20 条（共 '+out.length+' 条，专属 '+ex+' 条）');
}

/* 类目 → 默认方法组合（自选题补齐用；放在注入区之外，避免 _build_emp.js 同步时被覆盖） */
const CAT_M = {search:['star_what','time_plan'], exp:['pit_res','wrong_book'], teach:['math_type','en_read'], geo:['geo_local','time_plan'], conv:['class_pick','choose_school']};
/* 自选题也能一键生成：优先在选题库找最贴近的一条当模板，找不到就按标题关键词兜底合成 */
function inferCat(title, a){
  const s = String(title||'');
  if(/地域|杭州|浙江|上海|江苏|大湾区|福建|成都|择校|陪读|本地/.test(s)) return 'geo';
  if(/避坑|踩坑|后悔|血泪|教训|真实感受|复盘/.test(s)) return 'exp';
  if(/怎么|如何|攻略|流程|清单|步骤|技巧|方法|备考|规划/.test(s)) return 'teach';
  if(/推荐|哪个|对比|测评|机构|课程|值不值/.test(s)) return 'conv';
  return 'search';
}
function enrichTopic(t, a){
  if(t.cat && t.hook && t.beats && t.beats.length && t.m && t.m.length) return t;
  const title = String(t.title||'');
  const core = title.replace(/^[^｜|]*[｜|]\s*/,'').trim() || title;
  const toks = title.split(/[｜|、,，。？?！!~～\s]+/).filter(s=>s.length>=2);
  // 只借用模板的「类目/类型/方法/标签」这类结构；hook/beats 一律围绕自己的标题写，避免正文跑题
  let best = null, bestScore = 0;
  BANK.forEach(b=>{
    let s = 0;
    toks.forEach(k=>{ if(b.title.includes(k) || (b.kw||'').includes(k)) s += 4; });
    (b.tags||[]).forEach(tg=>{ const w = tg.replace('#',''); if(w.length>=2 && title.includes(w)) s += 3; });
    if(a && b.aud && b.aud.includes(a.audience)) s += 2;
    if(s > bestScore){ bestScore = s; best = b; }
  });
  const tpl = bestScore >= 4 ? best : null;
  const cat = t.cat || (tpl ? tpl.cat : inferCat(title, a));
  const type = t.type || (tpl ? tpl.type : '经验复盘');
  const m = (t.m && t.m.length) ? t.m : (tpl ? tpl.m : (CAT_M[cat]||[]));
  const kw = t.kw || core;
  const aud = (t.aud && t.aud.length) ? t.aud : [(a && a.audience) || 'student'];
  const subj = (a && a.subjects) ? (String(a.subjects).split(/[\/、,，\s]+/).filter(Boolean)[0]||'') : '';
  const hook = t.hook || ('今天想聊一个很多人问我的问题：'+core+'。');
  const beats = (t.beats && t.beats.length) ? t.beats : [
    core+'，我当初也到处问人，后来发现真正有用的是先把'+(subj?subj+'这块':'基础')+'啃扎实，其他都是后话。',
    '说句实在的，'+core+'这事儿没有标准答案，但有几个坑是真的可以避开，我把自己跑通的做法放下面。'
  ];
  const tags = (t.tags && t.tags.length) ? t.tags : (tpl ? tpl.tags : []);
  return Object.assign({}, t, {cat, m, kw, type, aud, hook, beats, tags});
}

function renderChecks(){
  const t = state.activeTopic; if(!t) return;
  const box = $('#checks'); if(!box) return;
  const text = ($('#pTitle')?$('#pTitle').value:'') + '\n' + ($('#pBody')?$('#pBody').value:'');
  const tags = $('#pTags')?$('#pTags').value:'';
  const req = t.cat ? buildTags(t, accById(t.acctId) || activeAcct()) : [];
  const r = analyze(text, tags, req);
  const barCls = (v,inv)=> inv ? (v<=30?'g':v<=55?'a':'r') : (v>=70?'g':v>=50?'a':'r');
  let cls='ok', msg='可以发布：口语化达标、AI 味低、标签齐全';
  if(r.ban.length){ cls='bad'; msg='不要发布：出现「'+r.ban.slice(0,4).join('、')+'」，素人帖不能带机构/老师/招生字样'; }
  else {
    if(r.kouyu<50 || r.ai>45){ cls='warn'; msg='建议微调：口语化偏低或 AI 味偏高'; }
    if(r.kouyu<35 || r.ai>65){ cls='bad'; msg='不建议发布：太像 AI 写的，先把句子改口语'; }
    if(r.tagScore<100){ cls=(cls==='bad'?'bad':'warn'); msg='标签未带齐，补上再发'; }
  }
  const tagChips = r.requiredTags.map(x=>'<span class="tag'+(r.present.includes(x)?' cat':'')+'">'+(r.present.includes(x)?'✓ ':'✗ ')+esc(x)+'</span>').join('');
  box.innerHTML =
    '<div class="check"><div class="c-top">口语化 <span class="c-val">'+r.kouyu+'</span></div>'+
      '<div class="bar '+barCls(r.kouyu)+'"><i style="width:'+r.kouyu+'%"></i></div>'+
      '<div class="c-note">口语词 '+r.kouyuHits+' 处 · emoji '+r.emoji+' 个 · 平均句长 '+r.avgLen+' 字</div></div>'+
    '<div class="check"><div class="c-top">AI 味（越低越好） <span class="c-val">'+r.ai+'</span></div>'+
      '<div class="bar '+barCls(r.ai,true)+'"><i style="width:'+r.ai+'%"></i></div>'+
      '<div class="c-note">AI 套话 '+r.aiHits+' 处</div></div>'+
    (r.requiredTags.length?('<div class="check"><div class="c-top">标签齐全度 <span class="c-val">'+r.tagScore+'%</span></div>'+
      '<div class="bar '+barCls(r.tagScore)+'"><i style="width:'+r.tagScore+'%"></i></div>'+
      '<div class="taglist">'+tagChips+'</div></div>'):'')+
    '<div class="verdict '+cls+'">'+(cls==='ok'?'✓':cls==='warn'?'!':'×')+' '+esc(msg)+'</div>';
}

        '<div style="margin-top:8px;display:flex;gap:8px"><button class="btn sm" id="dCopyAll">复制全部上报</button><button class="btn sm ghost" id="dClear">清空</button></div>'
      : '<div class="empty-tip">还没有上报记录<br>上面填一篇试试</div>');

  const dd = $('#dDraft');
  if(dd) dd.onchange = ()=>{
    const dr = (state.drafts||{})[dd.value]; if(!dr) return;
    if($('#dTitle') && !$('#dTitle').value) $('#dTitle').value = dr.title||dd.value;
    if($('#dBody') && !$('#dBody').value) $('#dBody').value = dr.body||'';
    if($('#dLink') && !$('#dLink').value && dr.link) $('#dLink').value = dr.link;
    if($('#dAcct') && dr.acct && $('#dAcct').tagName==='SELECT'){
      const hit = Array.from($('#dAcct').options).find(o=>o.value===dr.acct);
      if(hit) $('#dAcct').value = dr.acct;
    }
    toast('已带出标题、文案'+(dr.link?'、链接':''));
  };
  const cxIn = $('#dCx');
  if(cxIn) cxIn.oninput = ()=>{ cxIn.value = String(Math.max(0, +cxIn.value||0)); };
  $('#dAdd').onclick = addDaily;
  $$('#panelBody [data-daily]').forEach(el=> el.onchange=()=>{ const it=state.daily.find(x=>x.id===el.dataset.daily); if(it){ it[el.dataset.f]=+el.value||0; save(); } });
  $$('#panelBody [data-deldaily]').forEach(el=> el.onclick=()=>{ state.daily=state.daily.filter(x=>x.id!==el.dataset.deldaily); save(); renderDaily(); });
  $$('#panelBody [data-copyrep]').forEach(el=> el.onclick=()=>{ const it=state.daily.find(x=>x.id===el.dataset.copyrep); if(it) copyText(dailyText(it)); });
  $$('#panelBody [data-viewbody]').forEach(el=> el.onclick=()=>{
    const it=state.daily.find(x=>x.id===el.dataset.viewbody); if(!it) return;
    showModal('这篇的文案 · '+esc(it.title),
      '<div style="white-space:pre-wrap;line-height:1.9;font-size:13px">'+esc(it.body||'（这篇没填文案）')+'</div>'+
      (it.link?'<div style="margin-top:10px"><a href="'+esc(it.link)+'" target="_blank" rel="noopener">打开笔记 ↗</a></div>':''),
      [{t:'关闭', fn:closeModal}]);
  });
  const ca=$('#dCopyAll'); if(ca) ca.onclick=()=>{ if(!state.daily.length){ toast('还没有上报记录'); return; } copyText(state.daily.map(dailyText).join('\n\n————————\n\n')); };
  const cl=$('#dClear'); if(cl) cl.onclick=()=>{ if(confirm('清空本地上报记录？（清空前建议先「导出汇总码」发给主管）')){ state.daily=[]; save(); renderDaily(); } };
}
function addDaily(){
  const title = ($('#dTitle').value||'').trim();
  if(!title){ toast('请填笔记标题'); return; }
  const cx = Math.max(0, +($('#dCx')?$('#dCx').value:0)||0);
  const acctName = ($('#dAcct')?($('#dAcct').value||'').trim():'') || SESSION.name;
  const me = (state.accounts||[]).find(a=>a.name===acctName) || activeAcct() || null;
  state.daily.unshift({id:uid(), title, body:($('#dBody')?$('#dBody').value:''),
    link:normLink($('#dLink').value||''), date:$('#dDate').value||todayStr(),
    views:+($('#dViews')?$('#dViews').value:0)||0,
    imp:0, like:+$('#dLike').value||0, cmt:+$('#dCmt').value||0,
    cx, note:($('#dNote')?($('#dNote').value||'').trim():''),
    acct:acctName, acctLink:(me&&me.link)||'', persona:(me&&me.persona)||'', status:''});
  save(); renderDaily(); renderMeta();
  toast('已上报 · 浏览 '+(+($('#dViews')?$('#dViews').value:0)||0)+' · 客资 '+cx+' 个');
}

function seedPool(){
  const seed = window.DSE_POOL_SEED;
  const items = (seed && Array.isArray(seed.items)) ? seed.items : FALLBACK_POOL;
  return {
    batch: (seed && seed.batch) || '2026-10-03',
    items: items.filter(x=>!(x.a||'').includes('橙子') && !(x.t||'').includes('橙子'))
  };
}
function poolToItems(seedItems, batch){
  return seedItems.map(x=>({id:uid(), t:x.t, a:x.a||'', l:x.l||'', dt:x.dt||'', s:x.s||'其他', u:x.u||'', batch:batch||'手动'}));
}
function dedupeKey(it){ return (it.u && it.u.trim()) ? it.u.trim() : (it.t||'').trim(); }
function mergePool(base, add){
  const seen = new Set(base.map(dedupeKey));
  const out = base.slice();
  add.forEach(it=>{ const k=dedupeKey(it); if(k && !seen.has(k)){ seen.add(k); out.push(it); } });
  return out;
}
/* 素材库只保留最新一批：清掉更早批次（含无批次的旧数据），
   避免主管端与员工端各自累加导致数量不一致。 */
function newestBatch(pool){
  return (pool||[]).map(x=>x.batch||'').filter(Boolean).sort().pop() || '';
}
function normalizePool(){
  const pool = state.pool || [];
  const batched = pool.filter(x=>x.batch);
  if(!batched.length) return;            // 全部无批次（刚粘贴同步码等），保留不动
  const latest = newestBatch(batched);
  const keep = pool.filter(x=>x.batch===latest);
  if(keep.length !== pool.length) state.pool = keep;
}

/* ===== 选题匹配 / 分配引擎 ===== */
const DAY = 86400000;
function curAcct(){ return state.persona; }
const AFF = ['转轨','体制内','港校','择校','陪读','学姐','学长','家长','英文','数学','物理','杭州','浙江','上海','江苏','大湾区','福建','成都','入学考','备考','听力','写作','口语','单词','错题','心态','时间','自学','机构','预算','复盘','入门','资料','模拟'];
function personaAff(t, a){
  const p = (a.name||'')+(a.subjects||'')+(a.extra||'')+(a.catch||'')+(a.year||'')+(a.tone||'');
  const tp = t.title+(t.kw||'')+t.type+(t.tags||[]).join('');
  let s = 0;
  AFF.forEach(k=>{ if(p.includes(k) && tp.includes(k)) s += 6; });
  return Math.min(s, 26);
}
/* 人设方向（摘星 / 遵理）：同方向加分；素材只属于另一个方向的选题直接排除 */
function personaGate(t, a){
  const p = (a&&a.persona)||'';
  if(p!=='摘星' && p!=='遵理') return 0;
  const src = (t&&t.src)||[];
  if(src.indexOf(p)>=0) return 18;
  if(src.indexOf('摘星')>=0 || src.indexOf('遵理')>=0) return -1;
  return 0;
}
// 单个选题对某个人设的匹配分（不做"专属漏斗"，避免同人群人设被推向同一批题）
function relevance(t, a){
  if(!t.aud.includes(a.audience)) return -9999;
  const pg = personaGate(t, a);
  if(pg < 0) return -9999;
  let s = pg;
  if(t.aud.length === 1) s += 12;                 // 专属选题小幅加权，不做强漏斗
  const kwPool = [...state.kw.core, ...state.kw.ext, ...state.kw.geo].join('|');
  if(kwPool.includes(t.kw)) s += 10;
  if(t.kw && (a.extra||'').includes(t.kw.slice(0,4))) s += 8;
  // 学科偏好：第一学科权重更高，拉开同人群不同人设的差异
  if(a.subjects){
    a.subjects.split(/[\/、,，]/).map(x=>x.trim()).filter(Boolean).forEach((sub,idx)=>{
      if(sub && (t.kw+t.title).includes(sub.slice(0,2))) s += idx===0 ? 22 : 9;
    });
  }
  if(t.cat==='geo'){
    const geoHit = state.kw.geo.some(g=> t.kw && g.includes(t.kw.slice(0,2)));
    if(geoHit) s += 8;
    const aGeo = /浙江|杭州|上海|江苏|大湾区|福建|成都|地域/.test(a.extra||'');
    const tGeo = /浙江|杭州|上海|江苏|大湾区|福建|成都/.test(t.kw);
    if(aGeo) s += 12;
    if(aGeo && tGeo) s += 16;                     // 地域号命中本地长尾词，强相关
    if(!aGeo && tGeo) s -= 8;                     // 非地域号少给纯地域题
  }
  s += personaAff(t, a);
  // 新鲜度：素材来源越新越高
  const srcNew = t.src.reduce((mx,sn)=>{ const it = state.pool.find(p=>p.s===sn); const d = it&&parseDt(it.dt); return d? Math.max(mx, d.getTime()) : mx; }, 0);
  if(srcNew){ const days = (Date.now()-srcNew)/DAY; s += Math.max(0, 10-days); }
  // 人设稳定扰动：同一个人设结果可复现
  s += (hashStr(a.id+'|'+t.title)%900)/100;
  return s;
}
// 兼容旧调用
function scoreTopic(t, a){ return relevance(t, a); }

/* 跨人设轮转分配：一个选题只会分给一个账号，从机制上保证人设之间不重复 */
function planTopics(){
  const accts = (state.accounts||[]).filter(a=>a && a.audience);
  const plan = {};
  accts.forEach(a=> plan[a.id]=[]);
  const catNames = Object.keys(CAT_RATIO);
  catNames.forEach(c=>{
    const quota = CAT_RATIO[c];
    const cands = BANK.filter(t=>t.cat===c);
    const used = new Set();
    // 每个账号对该类目候选打分排序
    const sc = {};
    accts.forEach(a=>{
      sc[a.id] = cands.map(t=>({t, s:relevance(t,a)})).sort((x,y)=>y.s-x.s);
    });
    // 轮转挑选：每轮从不同账号开始，保证公平；被挑走的题不再复用，且同账号内绝不重复
    for(let r=0; r<quota; r++){
      const n = accts.length;
      for(let k=0;k<n;k++){
        const a = accts[(r+k)%n];
        const list = sc[a.id];
        const mine = new Set(plan[a.id].map(x=>x.title));
        let pick = list.find(o=> o.s>-9999 && !used.has(o.t.title) && !mine.has(o.t.title))
                || list.find(o=> o.s>-9999 && !mine.has(o.t.title))   // 全局池被抢空时，优先避免本账号重复
                || list.find(o=> o.s>-9999);                          // 最后兜底
        if(pick){ plan[a.id].push(pick.t); used.add(pick.t.title); }
      }
    }
  });
  // 去重保险：同账号内标题必须唯一
  accts.forEach(a=>{
    const seen = new Set(); const uniq = [];
    plan[a.id].forEach(t=>{ if(!seen.has(t.title)){ uniq.push(t); seen.add(t.title); } });
    plan[a.id] = uniq;
  });
  // 补足到 20 条（类目候选不足时，从该人设全部候选里按分补齐）
  accts.forEach(a=>{
    if(plan[a.id].length >= 20) return;
    const seen = new Set(plan[a.id].map(t=>t.title));
    BANK.map(t=>({t, s:relevance(t,a)})).sort((x,y)=>y.s-x.s).forEach(o=>{
      if(plan[a.id].length<20 && o.s>-9999 && !seen.has(o.t.title)){ plan[a.id].push(o.t); seen.add(o.t.title); }
    });
  });
  return plan;
}

/* 把方法步骤里的书面符号改口语，再切成短句（提口语化、降平均句长） */
function softenStep(s){
  return String(s)
    .replace(/＋/g,'、')
    .replace(/→/g,'，再')
    .replace(/[；;]/g,'。')
    .replace(/：/g,'，')
    .replace(/[。！]+$/,'')
    .trim();
}
function toShortSents(s, maxLen){
  maxLen = maxLen || 14;
  const segs = softenStep(s).split(/[。！？!?]/).map(x=>x.trim()).filter(Boolean);
  const out = [];
  segs.forEach(seg=>{
    const parts = seg.split(/[，,]/).map(y=>y.trim()).filter(Boolean);
    let buf = '';
    parts.forEach(p=>{
      if(!buf) buf = p;
      else if((buf+'，'+p).length <= maxLen) buf += '，'+p;
      else { out.push(buf); buf = p; }
    });
    if(buf) out.push(buf);
  });
  // 太短的碎片并回上一句，避免"否则罚。"这种断句
  for(let k=out.length-1;k>0;k--){
    if(out[k].length<5 && (out[k-1]+'，'+out[k]).length<=22){ out[k-1]+='，'+out[k]; out.splice(k,1); }
  }
  return out;
}
/* =========================================================
   取标题：复用公众号「六大标题法则」到小红书选题
   ①问题式 勾起好奇 ②利益导向 直接给好处 ③情感共鸣 说进心里
   ④权威数据 用分数/结果背书 ⑤反差对比 制造落差 ⑥悬念式 留钩子
   标题给钩子，正文先共情再给方法——两套写作逻辑相通
   ========================================================= */
// 标题必须基于「选题标题」本身生成（不能只用关键词，否则同类选题标题会一模一样）
const _cleanT = s => String(s||'').replace(/[？?！!。，,、；;：:\s"'“”]+$/,'').trim();
const _tBase = t => _cleanT((t&&t.title)||(t&&t.kw)||'');
const _tKw  = t => _cleanT((t&&t.kw)||'');
// FNV-1a + 雪崩混合：相似字符串也能散开，避免不同选题 hash 后落到同一个钩子
const _hash = s => { let h=2166136261; s=String(s); for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } h^=h>>>13; h=Math.imul(h,0x5bd1e995); h^=h>>>15; return h>>>0; };
const _pick = (arr,seed)=> (arr&&arr.length)? arr[(((seed>>>0)%arr.length)+arr.length)%arr.length] : '';
/* 同一法则已用过的钩子：连着写不同选题时，先把没用过的用完，再重开一轮，
   这样“上个选题的②利益式”和“这个选题的②利益式”不会撞同一句尾巴 */
const _recentHooks = {};
function _hookFresh(key, tl){
  const used = _recentHooks[key] || (_recentHooks[key]=[]);
  if(used.indexOf(tl)>=0) return false;
  used.push(tl);
  return true;
}
/* 从候选里挑一条没被这个法则用过的；整轮用尽就重置，保证一定有结果 */
function _pickFresh(key, items, seed){
  if(!items.length) return null;
  const n = items.length;
  for(let pass=0; pass<2; pass++){
    const st = seed % n;
    for(let i=0;i<n;i++){
      const it = items[(st+i)%n];
      if(_hookFresh(key, it.tl)) return it;
    }
    _recentHooks[key] = [];
  }
  return null;
}
// 判断是不是问句：是就用「？」收尾，不是就补一个反问，读着才顺
const _isQ = s => /[？?]$/.test(String(s||'')) || /(吗|呢|怎么|如何|为什么|为啥|要不要|值不值|难不难|哪个|哪些|多少|多久|能不能|可不可以|到底)/.test(String(s||''));
/* 抽「选题核心」：去掉“踩过的坑：”这类标签前缀和句首的“到底/究竟”，
   但保留选题本来的问法（如“会考口语吗/怎么突击”），标题才不会整句照抄选题 */
function _tCore(t){
  let s = _cleanT((t&&t.title)||'');
  s = s.replace(/^(踩过的坑|亲测|实测|避坑|干货|经验|复盘|记录|分享|科普|解答|答疑)[：:]/,'');
  s = s.replace(/^(到底|究竟|请问|想问下|想问)/,'');
  return s.trim() || _cleanT((t&&t.title)||'');
}
/* 选题「类型」决定钩子口味：答疑给信息感、攻略给方法感、复盘/共鸣给心路感、避坑给踩坑感。
   这样钩子才贴题，不会出现“调整心态，按这4步走”这种串味 */
function _tFlavor(t){
  const ty = String((t&&t.type)||'');
  if(/避坑|对比|测评/.test(ty)) return 'pit';
  if(/经验|复盘|情绪|共鸣/.test(ty)) return 'story';
  if(/攻略|干货/.test(ty)) return 'how';
  return 'info';
}
/* 六大法则的「钩子库」：每个法则按选题口味（info/how/story/pit）分池，各备 5 条，
   再按选题标题 hash 轮换——不同选题（哪怕关键词相同）不会被盖上同一句尾巴。
   钩子一律写成「能接在核心后面的一句话」，且尽量不跟选题内容打架（避免串味）。 */

/* 拼一条标题：先挑出所有「放得下」的钩子，再优先选这个法则还没用过的，
   一整轮用完才重置——连着写不同选题也不会撞同一句尾巴 */
function _mkTitle(key, t, C){
  const flavor = _tFlavor(t);
  const pool = (TITLE_POOLS[key]||{})[flavor] || [];
  if(!pool.length) return '';
  const K = _tKw(t);
  if(key==='q'){
    const Cq = String(C).replace(/[？?]+$/,'');
    if(_isQ(t.title)){
      const items = Q_ASIDE.map(a=>({tl:a, s:Cq+'？'+a})).filter(x=>x.s.length<=20);
      const it = _pickFresh(key, items, _hash(t.title+'|qa'));
      return it ? it.s : Cq+'？';
    }
    const items = pool.map(tl=>({tl, s:Cq+'，'+tl+'？'})).filter(x=>x.s.length<=20);
    const it = _pickFresh(key, items, _hash(t.title+'|q'));
    return it ? it.s : '';
  }
  const shapes = TITLE_SHAPES[key]||[];
  const items = [];
  for(const tl of pool){
    for(const sh of shapes){
      let s='';
      try{ s = String(sh(C,K,tl)); }catch(e){ continue; }
      if(s && s.length<=20){ items.push({tl,s}); break; }
    }
  }
  const it = _pickFresh(key, items, _hash(t.title+'|'+key));
  return it ? it.s : '';
}
/* 标题五法：①好奇/颠覆 ②共鸣 ③痛点 ④预期 ⑤借势
   ≤20 字、说人话；钩子从选题自己的钩子/论点/方法/细节里长出来，不用固定尾巴 */
const _SUBJ_RE = /(英文|英语|数学|中文|物理|化学|经济|公社|生物|历史|地理)/;
const _EXAM_RE = /(摘星|遵理)/;
const _GENERIC_T = ['看完就懂','一定要看','建议收藏','干货满满','新手必看','一文读懂','深度好文'];
const _noSpace = s => String(s||'').replace(/\s+/g,'').replace(/[。；;，,、：:]+$/,'').trim();
function _firstClause(s, max){
  const segs = _noSpace(s).split(/[。！？!?；;，,：:]/).map(x=>x.trim()).filter(Boolean);
  let out = '';
  for(const seg of segs){
    if(!out) out = seg;
    else if((out+'，'+seg).length <= (max||18)) out += '，'+seg;
    else break;
  }
  return out;
}
function _methodTitle(m, head, subject, exam){
  let n = _noSpace(m && m.name);
  if(!n) return '';
  if(!/DSE|摘星|遵理|英文|英语|数学|中文|物理|化学|经济/.test(n)){
    if(subject) n = subject + n;
    else if(exam) n = exam + n;
    else n = 'DSE' + n;
  }
  if(n.length>20) n = _firstClause(n, 20);
  return n.length<=20 ? n : '';
}
function _numClause(s){
  const segs = _noSpace(s).split(/[。！？!?；;，,]/).map(x=>x.trim()).filter(Boolean);
  for(const seg of segs){
    if(/(\d|[一二三四五六七八九十两半])/.test(seg) && seg.length>=8 && seg.length<=20) return seg;
  }
  return '';
}
function _borrowTitle(a, head, t){
  const aud = (a && a.audience) || (t.aud && t.aud[0]) || 'student';
  const year = _noSpace((a && a.year) || '');
  if(year && year.length<=8){
    const pre = aud==='parent' ? year+'家长：' : year+'过来人：';
    const s = pre + head;
    if(s.length<=20) return s;
  }
  const exam = (String(t.title+t.kw).match(_EXAM_RE)||[])[1];
  if(exam){
    const s = '考过两次'+exam+'，说点大实话';
    if(s.length<=20) return s;
  }
  return '';
}
function _titleScore(s, head, subject, exam){
  let sc = 0;
  if(s.length>=9 && s.length<=18) sc += 3;
  else if(s.length<=20) sc += 1;
  if(head && s.indexOf(head.slice(0,4))>=0) sc += 2;
  if(subject && s.indexOf(subject)>=0) sc += 1;
  if(exam && s.indexOf(exam)>=0) sc += 1;
  if(/[？?]$/.test(s)) sc += 1;
  _GENERIC_T.forEach(w=>{ if(s.indexOf(w)>=0) sc -= 4; });
  if(/(非常|十分|极其|显著|全面|有效提升)/.test(s)) sc -= 2;
  return sc;
}
function titleVariants(t,a){
  const out = [];
  const seen = new Set();
  const raw = _tCore(t);
  const head = _firstClause(raw, 14) || _noSpace(raw);
  const subject = (String(t.title+(t.kw||'')+(t.m||[]).join('')).match(_SUBJ_RE)||[])[1] || '';
  const exam = (String(t.title+(t.kw||'')).match(_EXAM_RE)||[])[1] || '';
  const ms = effectiveMethods(t) || [];
  const beats = (t.beats||[]).slice();
  const steps = ms.reduce((arr,m)=>arr.concat(m.steps||[]), []);
  const cands = [];
  const push = (tag, s)=>{
    s = _noSpace(s);
    if(!s || s.length<6 || s.length>20 || seen.has(s) || /橙子/.test(s)) return;
    cands.push({tag, s});
  };
  if(t.hook) push('②共鸣', _firstClause(t.hook, 18));
  ms.forEach(m=> push('①颠覆', _methodTitle(m, head, subject, exam)));
  beats.forEach(b=> push('③痛点', _firstClause(b, 18)));
  steps.forEach(s=> push('④预期', _numClause(s)));
  push('⑤借势', _borrowTitle(a, head, t));
  if(!cands.length){
    push('①好奇', head+'，我踩过的坑都在这');
    push('③痛点', head+'，难的不是不会');
  }
  const order = ['②共鸣','①颠覆','③痛点','④预期','⑤借势','①好奇'];
  const picked = [];
  order.forEach(tag=>{
    const list = cands.filter(c=>c.tag===tag).sort((x,y)=>_titleScore(y.s,head,subject,exam)-_titleScore(x.s,head,subject,exam));
    if(list.length){
      const c = list[0];
      if(!picked.find(p=>p.s===c.s)) picked.push(c);
    }
  });
  if(picked.length<5){
    cands.sort((x,y)=>_titleScore(y.s,head,subject,exam)-_titleScore(x.s,head,subject,exam)).forEach(c=>{
      if(picked.length<5 && !picked.find(p=>p.s===c.s)) picked.push(c);
    });
  }
  const all = picked.map(c=>({tag:c.tag, text:c.s, sc:_titleScore(c.s,head,subject,exam)}));
  if(t.title && t.title.length<=20) all.push({tag:'原标题', text:t.title, sc:_titleScore(t.title,head,subject,exam)});
  all.sort((x,y)=> y.sc - x.sc).forEach(c=> out.push({tag:c.tag, text:c.text}));
  return out.slice(0,6);
}

const M_SUBJ = {en_read:'en', en_write:'en', en_listen:'en', en_words:'en', en_base:'en', en_oral:'en', en_grammar:'en',
  cn_read:'cn', cn_write:'cn', cn_wenyan:'cn', cn_listen:'cn',
  math_type:'ma', math_trig:'ma', math_lose:'ma', math_p2:'ma',
  phy_eddy:'phy', phy_mech:'phy'};
const SUBJ_FILL = {phy:['phy_mech','phy_eddy'], cn:['cn_read','cn_write','cn_wenyan','cn_listen'],
  en:['en_listen','en_read','en_words','en_grammar','en_oral'], ma:['math_type','math_trig','math_lose']};
function _topicSubj(t){
  const s = String(t.title + (t.kw||''));
  if(/物理/.test(s)) return 'phy';
  if(/化学/.test(s)) return 'che';
  if(/中文|文言/.test(s)) return 'cn';
  if(/英文|英语|口语|Listening|Reading|Writing|语法/.test(s)) return 'en';
  if(/数学/.test(s)) return 'ma';
  return '';
}
function effectiveMethods(t){
  const CM = {search:['star_what','time_plan'], exp:['pit_res','wrong_book'], teach:['math_type','en_read'], geo:['geo_local','time_plan'], conv:['class_pick','choose_school']};
  const subj = _topicSubj(t);
  let ks = (t.m||[]).filter(k=>METHODS[k]);
  if(subj){
    ks = ks.filter(k=> !M_SUBJ[k] || M_SUBJ[k]===subj);
    (SUBJ_FILL[subj]||[]).forEach(k=>{ if(ks.length<3 && !ks.includes(k)) ks.push(k); });
    return ks.slice(0,3).map(k=>METHODS[k]).filter(Boolean);
  }
  (CM[t.cat]||[]).forEach(k=>{ if(ks.length<3 && !ks.includes(k)) ks.push(k); });
  return ks.slice(0,3).map(k=>METHODS[k]).filter(Boolean);
}

function _spokenStep(s, i){

  let list = paras.filter(Boolean);
  let body = list.join('\n\n');
  // 小红书目标 500—700 字：超了去掉过渡句重排，短了在结尾前补一句心路
  if(body.length > 700){
    list = [open, thesis, ...ms.map(m=>{
      let p = _shortName(m) + '。';
      (m.steps||[]).forEach((s,si)=>{ p += _spokenStep(s,si); });
      if(m.tip) p += m.tip;
      return p;
    }), V_JINJU[_hash(t.title+'j')%V_JINJU.length], close].filter(Boolean);
    body = list.join('\n\n');
  }
  if(body.length < 560){
    list.splice(Math.max(1, list.length-1), 0, '写这篇的时候我又翻了一遍当时的错题，很多坑其实早就有人提醒过，只是自己没当回事。那阵子每天都很焦虑，看到别人进步就更慌，后来才明白，焦虑本身不解决问题，把手边那一件小事做完才算。');
    body = list.join('\n\n');
  }
  return cleanPost(body);
}
/* 公众号版：1200—1800 字，带小标题；同一套内容，展开讲透 */
const V_WX_EXP = [
  m=>'拿'+m+'来说，真正拉开差距的不是知不知道，而是有没有照着做满两周。我第一周也觉得别扭，第二周开始顺手，第三周才看到分数变化，这个过程急不来。',
  m=>m+'这件事，我踩过最大的坑是贪多。一次只改一个动作，改到不用想就能做出来，再换下一个。想一口气全改完的，基本都在第三周放弃了。',
  m=>m+'我一开始也怀疑有没有用，后来发现它解决的不是"会不会"，而是"考场上能不能稳定做出来"。这两件事差得很远，平时会做不等于考场拿得到分。',
  m=>'关于'+m+'，我建议先小范围试：挑一套卷子只练这一件事，做完认真对答案，看看到底差在哪一步。找到那一步，比刷十套卷都有用。'
];
const V_WX_CASE = [
  '我印象最深的是有一次模考，前面几题顺得不行，到后面突然卡住，才发现自己一直是"会做但做不快"。后来按这个思路练了一个月，同样的卷子能提前十分钟做完，剩下的时间刚好用来检查。',

];
const V_WX_PLAN = [
  '时间上我是这么排的：平时每天固定一小时，只做一件事；周末拿半天做整套，把这一周的问题集中过一遍。不求每天都满，但求不断线。',
  '节奏上别追求一口气全改。一周只盯一个点，下周再加一个，两个月回头看，变化比自己想象中大得多。',

];
const V_WX_END = [
  '写到这，其实最想说的是：别把别人的经验当标准答案。挑一条今天就能做的，先做起来，比收藏十篇都有用。',
  '如果你也在这一步卡着，不用急着全做到。先把最容易的那一条落地，剩下的慢慢来，路是一步一步走出来的。',
  '这些方法不一定适合所有人，但都是我真实试过的。你按自己的节奏挑着用，能少走一点弯路就够了。'
];
const V_WX_FILL = [
  '我知道看这类内容的人，多半已经在焦虑里泡了一段时间。我能给的只有自己试过的路，不一定适合所有人，但至少能让你少走一点弯路。',
  '最后补一句：方法看再多，不动手都是别人的。挑一个今天就能做的小动作，先做三天，你自然会知道有没有用。',
  '写这些的时候我又翻了一遍当时的本子，很多当时觉得过不去的坎，现在看其实就那几步。你要是正卡在那，别急，一步一步来就好。'
];
function buildWx(t, a){
  const core = _firstClause(_tCore(t), 18);
  const ms = effectiveMethods(t);
  const beats = (t.beats||[]).filter(Boolean);
  const head = '关于' + core + '，我把自己的经历和踩过的坑整理了一遍，写给正在这条路上的你。';
  const thesis = beats[0] ? '先说我现在的结论：' + beats[0] : '';
  const secs = ms.map((m,i)=>{
    const name = _shortName(m);
    const lines = [];
    lines.push('（' + ['一','二','三','四'][i] + '）' + name);
    lines.push('');
    (m.steps||[]).forEach((s,si)=>{ lines.push(_spokenStep(s,si)); });
    if(m.tip) lines.push(m.tip);
    lines.push([
      '这一步看着笨，但它决定了后面所有努力有没有用。',
      '很多人卡住不是不努力，是顺序反了。',
      '别小看这个动作，知道和做到是两回事。'
    ][_hash(t.title+'w'+i)%3]);
    lines.push((V_WX_EXP[_hash(t.title+'wx'+i)%V_WX_EXP.length])(name));
    lines.push(V_WX_CASE[_hash(t.title+'wc'+i)%V_WX_CASE.length]);
    return lines.join('\n');
  });
  const plan = V_WX_PLAN[_hash(t.title+'plan')%V_WX_PLAN.length];
  const tail = [
    V_JINJU[_hash(t.title+'wj')%V_JINJU.length],
    V_WX_END[_hash(t.title+'we')%V_WX_END.length]
  ].filter(Boolean);
  let body = [head, thesis, ...(beats[1]?[beats[1]]:[]), '', ...secs, '', plan, '', ...tail].join('\n\n');
  let k = 0;
  while(body.length < 1200 && k < V_WX_FILL.length){
    body += '\n\n' + V_WX_FILL[k]; k++;
  }
  return cleanPost(body);
}
function buildPost(t, a){
  return {title:t.title, body:buildXhs(t,a), wxBody:buildWx(t,a), tags: buildTags(t,a).join(' ')};
}
const KOUYU = ['啊','啦','吧','嘛','呗','呀','哈','唉','诶','真的','就是','然后','超级','救命','呜呜','谁懂','讲真','说实话','反正','其实','挺','贼','巨','绝了','笑死','无语','服了','离谱','破防','姐妹','家人们','呜呜呜','啊啊','呜','哎','哦','咯','咧','唠','唠唠','确实','真心','说白了','压根','咋','啥','蛮','别','咱','踩坑','踩雷','亲测','直接','别急','死磕','麻了','靠谱','真香'];
const AIW = ['综上所述','总而言之','值得注意的是','由此可见','需要指出','总体而言','值得一提的是','一方面','另一方面','与此同时','赋能','助力','系统性','构建','打造','至关重要','不可忽视','随着'];
const EMOJI_RE = /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/u;
const splitSentences = t => t.split(/[。！？!?\n]/).map(s=>s.trim()).filter(Boolean);

function analyze(text, tags, requiredTags){
  const len = Math.max(text.length,1), per100 = 100/len;
  let kouyuHits=0; KOUYU.forEach(w=>{ let i=0; while((i=text.indexOf(w,i))>=0){ kouyuHits++; i+=w.length; } });
  const emoji=(text.match(EMOJI_RE)||[]).length;
  const excl=(text.match(/[！!~～]/g)||[]).length;
  const sents=splitSentences(text);
  const avgLen=sents.length? sents.reduce((a,b)=>a+b.length,0)/sents.length : 0;
  const shortRatio=sents.length? sents.filter(s=>s.length<=12).length/sents.length : 0;
  let kouyu = 37 + kouyuHits*per100*10 + emoji*4 + excl*3.5 + shortRatio*28 - Math.max(0,avgLen-30)*1.5;
  kouyu = Math.max(0,Math.min(100,Math.round(kouyu)));
  let aiHits=0; AIW.forEach(w=>{ let i=0; while((i=text.indexOf(w,i))>=0){ aiHits++; i+=w.length; } });
  const lens=sents.map(s=>s.length); let variance=0;
  if(lens.length>1){ const m=lens.reduce((a,b)=>a+b,0)/lens.length; variance=lens.reduce((a,b)=>a+(b-m)*(b-m),0)/lens.length; }
  const uniform=Math.max(0,1-Math.sqrt(variance)/14);
  const bullet=(text.match(/^[·•\-]/gm)||[]).length;
  let ai = aiHits*per100*16 + uniform*34 + Math.max(0,bullet-3)*3 + Math.max(0,avgLen-32)*1.1;
  ai = Math.max(0,Math.min(100,Math.round(ai)));
  const present = requiredTags.filter(t=> text.indexOf(t)>=0 || (tags||'').indexOf(t)>=0);
  const tagScore = requiredTags.length? Math.round(present.length/requiredTags.length*100) : 100;
  const ban = BAN_WORDS.filter(w=> text.indexOf(w)>=0 || (tags||'').indexOf(w)>=0);
  return {kouyu, ai, tagScore, present, kouyuHits, aiHits, emoji, avgLen:Math.round(avgLen), requiredTags, ban};
}

function renderMeta(){
  $('#metaPool').textContent = state.pool.length;
  $('#metaBatch').textContent = state.batch || '—';
  $('#metaAcct').textContent = state.accounts.length;
  $('#metaTopic').textContent = state.topics.length;
  $('#tabPoolCnt').textContent = state.pool.length;
  $('#tabTopicCnt').textContent = state.topics.length;
}
function renderWho(){
  $('#who').innerHTML = '<span class="badge">员工</span><span>'+esc(SESSION.name)+'</span>'+
    '<button class="btn ghost sm" id="btnExport">导出汇总码</button>'+
    '<button class="btn ghost sm" id="btnLogout">切换身份</button>';
  $('#btnExport').onclick = exportEmpCode;
  $('#btnLogout').onclick = ()=> (window.__cloud && __cloud.online) ? __cloud.logout() : location.reload();
}
/* 导出汇总码：把本人的人设/选题/草稿/上报打包成一段码，发给主管导入 */
function exportEmpCode(){
  const payload = {
    v:1, ns:NS, who:SESSION.name, at:Date.now(),
    accounts: state.accounts||[],
    topics: (state.topics||[]).map(t=>({title:t.title, cat:t.cat||'', status:t.status||'待写',
      acctName:t.acctName||'', acctId:t.acctId||'', from:t.from||''})),
    drafts: state.drafts||{},
    daily: state.daily||[]
  };
  const code = 'DSEEMP1:' + JSON.stringify(payload);
  showModal('我的汇总码（发给主管）',
    '<div class="hint-box">把下面这段复制发给主管，他粘贴进后台就能看到你的人设、选题、草稿和上报数据。<br>共 '+payload.accounts.length+' 个人设 · '+payload.topics.length+' 条选题 · '+Object.keys(payload.drafts).length+' 份草稿 · '+payload.daily.length+' 条上报。</div>'+
    '<textarea class="inp" id="empCode" rows="9" readonly>'+esc(code)+'</textarea>',
    [{t:'关闭', fn:closeModal},{t:'复制汇总码', primary:true, fn:()=>{ copyText($('#empCode').value); toast('已复制，发给主管即可'); }}]);
  const ta = $('#empCode'); if(ta) ta.onclick = ()=> ta.select();
  return code;
}
function renderAll(){ renderMeta(); switchTab(state.tab); }
function switchTab(name){
  state.tab = name;
  $$('#tabs .tab').forEach(t=> t.classList.toggle('active', t.dataset.tab===name));
  if(name==='today') renderToday();
  else if(name==='pool') renderPool();
  else if(name==='topic') renderTopic();
  else if(name==='daily') renderDaily();
}
function init(){
  renderWho(); renderAll();
  $$('#tabs .tab').forEach(t=> t.onclick = ()=> switchTab(t.dataset.tab));
  $('#overlay').onclick = e=>{ if(e.target.id==='overlay') closeModal(); };
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
}
function boot(){
  const lp = $('#lnkPersona'); if(lp) lp.href = FEISHU.persona;
  const ld = $('#lnkDaily'); if(ld) ld.href = FEISHU.daily;
  $('#btnEnter').onclick = enter;
  $('#gateName').onkeydown = e=>{ if(e.key==='Enter') enter(); };
  // 网站版：登录信息从登录页带过来，云端拉一次数据再渲染
  const s = (window.__cloud && __cloud.session && __cloud.session());
  if(s && s.role==='emp'){ cloudEnter(s); return; }
  if(window.__cloud && __cloud.online && !s){ location.replace('index.html'); return; }
  $('#gate').classList.add('show');
}
function cloudEnter(s){
  setNamespace(s.ns);
  SESSION = {name:s.name};
  $('#gate').classList.remove('show');
  $('#app').style.display = 'flex';
  loadState(); autoPullSeed(); init();          // 先用本机缓存渲染，避免白屏
  if(!(window.__cloud && __cloud.online)) return;
  __cloud.pull().then(()=>{
    loadState(); autoPullSeed(); save();        // 云端数据落地后回写一次（写上 who，主管才认得出是谁）
    renderWho(); switchTab(state.tab||'today');
    __cloud.start(cloudOnRemote);
  }).catch(()=>{ __cloud.start(cloudOnRemote); });
}
function cloudOnRemote(){
  if(document.querySelector('#overlay.show')) return;
  const t = state.tab;
  loadState(); renderWho(); switchTab(t||'today');
}
function enter(){
  const name = ($('#gateName').value||'').trim();
  if(!name){ $('#gateErr').textContent='请先填一个代号或昵称'; return; }
  setNamespace('u_'+hashStr(name).toString(36));
  SESSION = {name};
  loadState(); autoPullSeed(); save();
  $('#gate').classList.remove('show');
  $('#app').style.display = 'flex';
  init();
}
function showModal(title, body, btns){
  $('#modal').innerHTML =
    '<div class="modal-head"><h3>'+esc(title)+'</h3><span class="x" id="mClose">×</span></div>'+
    '<div class="modal-body">'+body+'</div>'+
    '<div class="modal-foot">'+btns.map((b,i)=>'<button class="btn '+(b.primary?'primary':'')+'" data-b="'+i+'">'+esc(b.t)+'</button>').join('')+'</div>';
  $('#overlay').classList.add('show');
  $('#mClose').onclick = closeModal;
  $$('#modal [data-b]').forEach(el=> el.onclick = btns[+el.dataset.b].fn);
}
function closeModal(){ $('#overlay').classList.remove('show'); }
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=> toast('已复制')).catch(()=> fallbackCopy(t));
  } else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('已复制'); }catch(e){ toast('复制失败，请手动复制'); }
  document.body.removeChild(ta);
}

boot();
